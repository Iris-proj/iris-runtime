[package]
name = "iris"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = { version = "2.0.1", features = ["std", "derive", "serde"] }
zip = "8.5.1"
inkwell = { version = "0.9.0", features = ["llvm22-1"] }
libc = "0.2"
ash = "0.38.0"
melior = { version = "0.27.4", optional = true }
argh = "0.1.19"

[features]
default = []
mlir = ["dep:melior"]
